services:
  api:
    build:
      context: ./backend
    environment:
      - TROUBLESHOOTER_DELAY_MS=${TROUBLESHOOTER_DELAY_MS:-4500}
      - MONGO_URI=${API_MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-kupa_rashit}
    ports:
      - "8000:8000"
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  ui:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_MAIN_API_BASE_URL=http://api:8000
      - VITE_KPR_API_BASE_URL=http://api:8000
      - VITE_EXCH_API_BASE_URL=http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
      - mongo

volumes:
  mongo_data:
